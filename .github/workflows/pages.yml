name: Web (GitHub Pages)

# Web z web/ se nahrává do repa CibulkaOS/cibulkaos.github.io (Pages z větve main)
# → https://cibulkaos.github.io/. Zápis přes deploy klíč jen pro to repo (secret PAGES_DEPLOY_KEY).

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_REPO: CibulkaOS/cibulkaos.github.io
  SITE_URL: https://cibulkaos.github.io/

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cibulkaos.github.io
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Nahrát web do ${{ env.SITE_REPO }}
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/pages_deploy
          chmod 600 ~/.ssh/pages_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/pages_deploy -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:${SITE_REPO}.git" site
          rsync -a --delete --exclude .git web/ site/
          touch site/.nojekyll

          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Web se nezměnil."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Web z ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:main

