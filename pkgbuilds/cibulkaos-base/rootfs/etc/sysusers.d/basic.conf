# CibulkaOS override of /usr/lib/sysusers.d/basic.conf
# Superuser (UID 0) je 'cibulka', nikoli 'root' (zabrání tvorbě duplicitního root:979 účtu).

# The superuser
g root    0       -            -
u cibulka 0:0     "Petr Cibulka" /root /usr/bin/zsh

# The nobody user/group for NFS file systems
g nobody 65534       -            -
u! nobody 65534:65534 "Kernel Overflow User"     -

# Administrator group: can *see* more than normal users
g adm     -     -            -

# Administrator groups: can *do* more than normal users
g wheel   -     -            -
g empower -     -            -

# Access to shared database of users on the system
g utmp    -     -            -

# Physical and virtual hardware access groups
g audio   -     -            -
g clock   -     -            -
g disk    -     -            -
g input   -     -            -
g kmem    -     -            -
g kvm     -     -            -
g lp      -     -            -
g optical -     -            -
g render  -     -            -
g sgx     -     -            -
g storage -     -            -
g tty     5     -            -
g uucp    -     -            -
g video   -     -            -

# Default group for normal users
g users   -     -            -
