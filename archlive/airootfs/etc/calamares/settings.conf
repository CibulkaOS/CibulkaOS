---
modules-search: [ local, /usr/lib/calamares/modules ]

# Custom instance konfigurace - bez teto sekce by Calamares pouzil
# defaultni shellprocess.conf pro vsechny instance (viz Settings.cpp:77,
# kde m_configFileName = key.module() + ".conf").
instances:
  - id: restore-kernel
    module: shellprocess
    config: shellprocess@restore-kernel.conf
  - id: grub-background
    module: shellprocess
    config: shellprocess@grub-background.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - initcpiocfg
    - shellprocess@restore-kernel
    - shellprocess
    - initcpio
    - grubcfg
    - bootloader
    - shellprocess@grub-background
    - preservefiles
    - umount
  - show:
    - finished

branding: cibulkaos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
