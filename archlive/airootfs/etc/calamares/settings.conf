---
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - hwclock
    - services-systemd
    - initcpiocfg
    - shellprocess@restore-kernel
    - shellprocess
    - initcpio
    - grubcfg
    - bootloader
    - shellprocess@grub-background
    - umount
  - show:
    - finished

branding: cibulkaos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
