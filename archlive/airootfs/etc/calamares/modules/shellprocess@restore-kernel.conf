---
# Obnovi kernel a microcode v cilove instalaci pred initcpio.
# Bezi v chrootu (default); zdroj je squashfs zaloha v /usr/share/cibulkaos/boot/.
# Pozn.: Calamares shellprocess pouziva klic 'dontChroot', nikoli 'chroot'.
dontChroot: false
timeout: 60
script:
    - "/usr/lib/cibulkaos/restore-kernel"
