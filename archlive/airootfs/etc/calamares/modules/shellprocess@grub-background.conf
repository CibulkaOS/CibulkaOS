---
# Nainstaluje vlastní Anti-GRUB téma (zlatý halftone portrét + razítko) a přegeneruje grub.cfg
dontChroot: false
timeout: 60
script:
    - "install -d /boot/grub/themes/cibulkaos"
    - "cp -r /usr/share/grub/themes/cibulkaos/. /boot/grub/themes/cibulkaos/"
    - "grep -q '^GRUB_THEME=' /etc/default/grub && sed -i 's|^GRUB_THEME=.*|GRUB_THEME=\"/boot/grub/themes/cibulkaos/theme.txt\"|' /etc/default/grub || echo 'GRUB_THEME=\"/boot/grub/themes/cibulkaos/theme.txt\"' >> /etc/default/grub"
    - "grep -q '^GRUB_TERMINAL_OUTPUT=' /etc/default/grub && sed -i 's|^GRUB_TERMINAL_OUTPUT=.*|GRUB_TERMINAL_OUTPUT=\"gfxterm\"|' /etc/default/grub || echo 'GRUB_TERMINAL_OUTPUT=\"gfxterm\"' >> /etc/default/grub"
    # grub-mkconfig ve stejném jazyce jako cílový systém (české položky menu Anti-GRUB)
    - "set -a; [ -r /etc/locale.conf ] && . /etc/locale.conf; set +a; grub-mkconfig -o /boot/grub/grub.cfg"
