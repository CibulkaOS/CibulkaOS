---
# Služby povolené/zakázané v instalovaném systému
services:
    - name: sddm
      enabled: true
    - name: NetworkManager
      enabled: true
    - name: fizlokracie
      enabled: true
    - name: systemd-timesyncd
      enabled: true
    - name: bluetooth
      enabled: false
    # Live-only služby - zakázat v instalovaném systému
    - name: choose-mirror
      enabled: false
    - name: pacman-init
      enabled: false
    - name: reflector
      enabled: false
