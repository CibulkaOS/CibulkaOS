---
# Služby povolené/zakázané v instalovaném systému
# Calamares services-systemd očekává klíč 'units' s položkami {name, action, mandatory}.
units:
    - name: "sddm.service"
      action: "enable"
      mandatory: true
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "fizlokracie.service"
      action: "enable"
      mandatory: false
    - name: "anti-grub-check.service"
      action: "enable"
      mandatory: false
    - name: "systemd-timesyncd.service"
      action: "enable"
      mandatory: false
    # Live-only a kolidující síťové služby - zakázat v instalovaném systému
    - name: "choose-mirror.service"
      action: "disable"
      mandatory: false
    - name: "pacman-init.service"
      action: "disable"
      mandatory: false
    - name: "reflector.service"
      action: "disable"
      mandatory: false
    - name: "livecd-talk.service"
      action: "disable"
      mandatory: false
    - name: "livecd-alsa-unmuter.service"
      action: "disable"
      mandatory: false
    - name: "systemd-networkd.service"
      action: "disable"
      mandatory: false
    - name: "systemd-networkd.socket"
      action: "disable"
      mandatory: false
    - name: "systemd-networkd-wait-online.service"
      action: "disable"
      mandatory: false
    - name: "iwd.service"
      action: "disable"
      mandatory: false
