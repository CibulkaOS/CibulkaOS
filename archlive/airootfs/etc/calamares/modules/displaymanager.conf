---
# SDDM jako display manager pro instalovaný systém
displaymanagers:
    - sddm

# Výchozí sezení = KDE Plasma 6 (Wayland -> /usr/share/wayland-sessions/plasma.desktop)
defaultDesktopEnvironment:
    executable: "startplasma-wayland"
    desktopFile: "plasma"

basicSetup: false
sysconfigSetup: false
