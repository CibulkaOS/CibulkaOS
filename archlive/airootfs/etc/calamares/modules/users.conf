---
# Konfigurace uživatelů - s lustrační ochranou podle Cibulkových seznamů
defaultGroups:
    - users
    - lp
    - video
    - network
    - storage
    - wheel
    - audio
    - optical
    - input

autologinGroup: autologin
sudoersGroup: wheel
sudoersConfigureWithGroup: false

# Rootovský účet (UID 0) se jmenuje 'cibulka' (viz patch v Calamares PKGBUILD)
setRootPassword: true
doReusePassword: true

allowWeakPasswords: true
allowWeakPasswordsDefault: true

passwordRequirements:
    minLength: 4
    maxLength: -1

user:
    shell: /bin/bash
    forbidden_names:
        - root
        - cibulka
        - agent
        - stb
        - kgb
        - gru
        - fsb
        - bures
        - reznik
        - stransky
        - blazej
        - kavka
        - horak
        - polacek
        - sebesta
        - mrazek
        - kovar
        - blaha
        - veselsky
        - kubicek
        - fiser
        - maly
        - cervenka
        - kaplan
        - adam
        - simek
        - vlasak
        - tuma
        - hana
        - kollar
        - janda
        - bartos
        - ondra
        - kaspar
        - jiri
        - modry
        - tajny
