---
# Konfigurace uživatelů - s lustrační ochranou
defaultGroups:
    - name: users
      state: true
    - name: lp
      state: true
    - name: video
      state: true
    - name: network
      state: true
    - name: storage
      state: true
    - name: wheel
      state: true
    - name: audio
      state: true
    - name: optical
      state: true
    - name: input
      state: true

autologinGroup:  autologin
sudoersGroup:    wheel

setRootPassword: true
rootPasswordSet: false

# Rootovský účet se jmenuje cibulka - heslo nastaví uživatel
# Jména zakázaná z bezpečnostních důvodů (rozšíření lustrace)
forbiddenUsernames:
    - root
    - cibulka
    - agent
    - stb
    - kgb
    - gru
    - fsb
    - reznik
    - blaha
    - kavka

passwordRequirements:
    minLength:          6
    maxLength:          -1
    libpwquality:
        - minlen=6

userShell: /bin/bash
