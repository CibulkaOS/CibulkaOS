---
# Zapíše /etc/default/grub v cílové instalaci (Anti-GRUB konfigurace)
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: 0
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISTRIBUTOR: "Anti-GRUB CibulkaOS"
    GRUB_THEME: "/boot/grub/themes/cibulkaos/theme.txt"
