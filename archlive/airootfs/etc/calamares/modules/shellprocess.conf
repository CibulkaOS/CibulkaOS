---
# Obnovuje /boot a opravuje mkinitcpio konfiguraci pro nainstalovaný systém.
#
# 1) mkarchiso vyprazdňuje /boot v airootfs.sfs pred tvorbou squashfs,
#    takze po unpackfs chybi kernel a microcode obrazy. Kopiruji je
#    primo z ISO mountu (/run/archiso/bootmnt/), ktery je vzdy dostupny
#    pres bind-mount arch-chroot. Squashfs zaloha slouzi jako fallback.
#
# 2) unpackfs zkopiruje archiso preset a hooks, ktere v nainstalovane
#    systemu nefunguji (mkinitcpio-archiso tam neni). Nahradime je
#    standardnim presetem z balicku linux.
chroot: true
timeout: 60
script:
    - "-rm -rf /usr/share/cibulkaos/boot"
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "install -Dm644 /usr/share/cibulkaos/linux.preset /etc/mkinitcpio.d/linux.preset"
    - "systemctl enable sddm.service"
