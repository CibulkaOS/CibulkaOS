---
# Uklidí live/archiso zbytky a nastaví standardní mkinitcpio preset pro nainstalovaný systém.
dontChroot: false
timeout: 60
script:
    - "-rm -rf /usr/share/cibulkaos/boot"
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "install -Dm644 /usr/share/cibulkaos/linux.preset /etc/mkinitcpio.d/linux.preset"
