---
# Uklidí live/archiso zbytky, nastaví mkinitcpio preset, vygeneruje unikátní SSH host klíče
# a inicializuje klíčenku pacmana přímo během instalace (před umount, aby byly bezpečně zapsané na Btrfs).
# Klíčenka: v live ISO je /etc/pacman.d/gnupg jen tmpfs (pacman-init.service), do cíle se nekopíruje,
# bez ní by první 'pacman -Syu' v nainstalovaném systému selhal na ověření podpisů.
dontChroot: false
timeout: 180
script:
    - "-rm -rf /etc/pacman.d/gnupg"
    - "pacman-key --init"
    - "pacman-key --populate archlinux"
    # gpg-agent spuštěný v chrootu by blokoval odpojení cílového disku
    - "-gpgconf --homedir /etc/pacman.d/gnupg --kill all"
    - "-rm -rf /usr/share/cibulkaos/boot"
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "install -Dm644 /usr/share/cibulkaos/linux.preset /etc/mkinitcpio.d/linux.preset"
    - "-rm -f /etc/ssh/ssh_host_*"
    - "ssh-keygen -A"
