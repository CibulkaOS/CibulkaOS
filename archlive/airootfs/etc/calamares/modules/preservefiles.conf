---
# Zachová Calamares log v nainstalovaném systému pro případnou diagnostiku.
# Pozor: UID 0 uživatel se jmenuje 'cibulka', nikoli 'root' (skupina GID 0 je 'root').
files:
    - from: log
      dest: /var/log/Calamares.log
      perm: cibulka:root:644
      optional: true
    - from: config
      dest: /var/log/Calamares-install.json
      perm: cibulka:root:600
      optional: true
