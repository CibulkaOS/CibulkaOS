[Unit]
# Odstraní ConditionPathExists, aby se při startu sshd přegenerovaly i případné 0B poškozené klíče.
# ssh-keygen -A je idempotentní (existující neprázdné klíče ponechá beze změny).
ConditionPathExists=

[Service]
ExecStartPre=/usr/bin/find /etc/ssh -maxdepth 1 -name 'ssh_host_*' -size 0 -delete
