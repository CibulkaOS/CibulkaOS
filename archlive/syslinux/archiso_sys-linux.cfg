LABEL arch
TEXT HELP
Spustit CibulkaOS instalacni medium na BIOS.
Umozni instalaci systemu nebo systemovou udrzbu. Chraneno pred GRU.
ENDTEXT
MENU LABEL CibulkaOS - Zahajit instalaci (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Spustit CibulkaOS instalacni medium na BIOS se cteckou obrazovky.
Umozni instalaci systemu nebo systemovou udrzbu s hlasovym vystupem.
ENDTEXT
MENU LABEL CibulkaOS - Zahajit instalaci (%ARCH%, BIOS) se ^cteckou
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
