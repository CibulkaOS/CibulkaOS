LABEL existing
TEXT HELP
Spustit system, ktery uz je na disku nainstalovany.
Klavesou TAB upravite cislo disku a oddilu.
ENDTEXT
MENU LABEL Spustit nainstalovany system
COM32 chain.c32
APPEND hd0 0

# https://www.memtest.org/
LABEL memtest
MENU LABEL Test pameti RAM (Memtest86+)
LINUX /boot/memtest86+/memtest

# https://wiki.syslinux.org/wiki/index.php/Hdt_(Hardware_Detection_Tool)
LABEL hdt
MENU LABEL Informace o hardwaru (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
TEXT HELP
Restartovat pocitac.
Firmware pocitace musi podporovat APM.
ENDTEXT
MENU LABEL Restartovat
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Vypnout pocitac.
Firmware pocitace musi podporovat APM.
ENDTEXT
MENU LABEL Vypnout
COM32 poweroff.c32
